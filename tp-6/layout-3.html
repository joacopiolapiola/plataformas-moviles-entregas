<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout N</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .content {padding: 2em 0.5em; text-align: center;}
        .s1 {background-color: #ca9f77;}
        .s2 {background-color: #cbc168;}
        .s3 {background-color: #a3c55b;}
        .s4 {background-color: #76d179;}
        .s5 {background-color: #85e3c1;}
        .s6 {background-color: #79bfe5;}
    </style>
</head>
<body>
    <div class="container-sm g-0">
        <div class="row g-0 justify-content-md-center justify-content-lg-center">
            <div class="col-12 col-md-6 col-lg-8">
                <div class="content s1">sección 1</div>
            </div>
        </div>
        <div class="row g-0">
            <div class="col-12 col-md-4 order-3 order-md-last col-lg-3 order-lg-first">
                <div class="content s2">sección 2</div>
            </div>
            <div class="col-12 col-md-4 order-2 col-lg-6">
                <div class="content s3">sección 3</div>
            </div>
            <div class="col-12 col-md-4 order-1 order-md-first col-lg-3 order-lg-last">
                <div class="content s4">sección 4</div>
            </div>
        </div>
    <div class="row g-0">
        <div class="col-12 col-md-6 col-lg-3 order-md-last order-lg-first">
            <div class="content s6">sección 6</div>
    </div>
    <div class="d-none d-lg-block col-lg-6"></div>
    <div class="col-12 col-md-6 col-lg-3 d-none d-sm-block ">
        <div class="content s5">sección 5</div>
    </div>
</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
